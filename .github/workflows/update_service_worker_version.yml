name: Deploy to GitHub Pages

on:
  push:
    branches: [main] # Change to whatever branch you want to trigger deployment
  workflow_dispatch:

# Required permissions for GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      # Increment version
      - name: Increment version
        id: version
        run: |
          CURRENT_VERSION=$(jq -r '.version' version.json)
          NEW_VERSION=$(echo $CURRENT_VERSION | awk -F. '{printf "%d.%d", $1, $2+1}')
          echo "{\"version\": \"$NEW_VERSION\"}" > version.json
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      # Commit version.json back to repo
      - name: Commit version update
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add version.json
          git diff --staged --quiet || git commit -m "chore: bump version to ${{ steps.version.outputs.version }}"
          git push

      # Replace version placeholders in files (for deployment only, not committed)
      - name: Update version in files
        run: |
          VERSION=${{ steps.version.outputs.version }}
          sed -i "s/__VERSION__/$VERSION/g" sw.js
          sed -i "s/__VERSION__/$VERSION/g" js/app.js
          sed -i "s/__VERSION__/$VERSION/g" js/ui.js

      # Upload to GitHub Pages
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
