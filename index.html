<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f0f1a">
    <meta name="description" content="Control your Moon Phase Lamp">
    <title>Moon Lamp Control</title>
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Modular CSS -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/tabs.css">
    <link rel="stylesheet" href="css/led-ring.css">
    <link rel="stylesheet" href="css/presets.css">
    <link rel="stylesheet" href="css/motor.css">
    <link rel="stylesheet" href="css/automations.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="stylesheet" href="css/responsive.css">
    
    <link rel="icon" type="image/png" href="icon-192.png">
</head>

<body>
    <div class="container">
        <header>
            <div class="app-title">
                <h1>🌙 Moon Lamp</h1>
                <span id="appVersion" class="app-version"></span>
            </div>
            <div class="header-actions">
                <div class="connection-status" id="connectionStatus">
                    <span class="status-dot" id="statusDot"></span>
                </div>
            </div>
        </header>

        <!-- Presets Tab -->
        <div class="tab-content active" id="presets">
            <div class="presets-layout">
                <div class="card color-presets-card">
                    <h2>Color Presets</h2>
                    <div class="preset-grid-scroll">
                        <div class="preset-grid">
                            <button class="preset-btn" data-preset="0">
                                <div class="preset-color" style="background: rgb(255,220,150);"></div>
                                <span>Warm White</span>
                            </button>
                            <button class="preset-btn" data-preset="1">
                                <div class="preset-color" style="background: rgb(255,100,0);"></div>
                                <span>Sunset</span>
                            </button>
                            <button class="preset-btn" data-preset="2">
                                <div class="preset-color" style="background: rgb(0,100,255);"></div>
                                <span>Ocean Blue</span>
                            </button>
                            <button class="preset-btn" data-preset="3">
                                <div class="preset-color" style="background: rgb(255,0,100);"></div>
                                <span>Pink Dream</span>
                            </button>
                            <button class="preset-btn" data-preset="4">
                                <div class="preset-color" style="background: rgb(100,255,100);"></div>
                                <span>Forest Green</span>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="card brightness-card">
                    <h2>Brightness</h2>
                    <div class="brightness-grid">
                        <button class="brightness-btn" data-brightness="0">0%</button>
                        <button class="brightness-btn" data-brightness="25">25%</button>
                        <button class="brightness-btn" data-brightness="50">50%</button>
                        <button class="brightness-btn" data-brightness="75">75%</button>
                        <button class="brightness-btn" data-brightness="100">100%</button>
                    </div>
                    <div class="brightness-slider-container">
                        <div class="brightness-slider" id="brightnessSlider">
                            <div class="brightness-slider-fill" id="brightnessSliderFill"></div>
                            <span class="brightness-slider-value" id="brightnessSliderValue">50%</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Custom Tab -->
        <div class="tab-content" id="custom">
            <!-- LED Ring Visualization (only visible on Custom tab) -->
            <div class="card">
                <div class="led-ring-header">
                    <h2>LED Ring</h2>
                    <label class="toggle-label">
                        <input type="checkbox" id="selectMultipleToggle">
                        <span>Select multiple</span>
                    </label>
                </div>
                <div class="led-ring" id="ledRing">
                    <!-- LEDs will be generated by JavaScript -->
                    <button class="led-center-btn" id="selectAllBtn">
                        <span>ALL</span>
                    </button>
                </div>
            </div>

            <!-- Unified LED Control -->
            <div class="card">
                <h2>LED Control</h2>
                <p class="info-text" id="ledControlInfo">Select LEDs in the ring above, then apply color and brightness.
                </p>

                <div class="color-picker">
                    <label>Color:</label>
                    <input type="color" id="colorPicker" value="#ffdc96">
                </div>
                <div class="brightness-control">
                    <label>Brightness:</label>
                    <input type="range" id="customBrightness" min="0" max="100" value="75">
                    <span id="customBrightnessValue">75%</span>
                </div>

                <p class="info-text" id="selectedLedInfo">Selected: <span id="selectedLedCount">0 LEDs</span></p>

                <button class="btn btn-primary" id="applyCustomBtn">Select LEDs first</button>
            </div>
        </div>

        <!-- Motor Tab -->
        <div class="tab-content" id="motor">
            <div class="card motor-card">
                <div class="motor-header">
                    <h2>Motor Control</h2>
                </div>
                <div class="motor-dial-container">
                    <svg id="motorDial" viewBox="0 0 250 250">
                        <!-- Outer circle -->
                        <circle cx="125" cy="125" r="100" fill="none" stroke="rgba(99,102,241,0.4)" stroke-width="3" />
                        <circle cx="125" cy="125" r="85" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="4 4" />
                        <!-- Degree markers -->
                        <g id="degreeMarkers"></g>
                        <!-- Current position marker (blue) -->
                        <line id="currentPosMarker" x1="125" y1="125" x2="125" y2="35" stroke="#3b82f6" stroke-width="4"
                            stroke-linecap="round" opacity="0.7" />
                        <!-- Target pointer (green) -->
                        <line id="motorPointer" x1="125" y1="125" x2="125" y2="35" stroke="#22c55e" stroke-width="5"
                            stroke-linecap="round" />
                        <circle cx="125" cy="125" r="14" fill="#22c55e" />
                        <circle cx="125" cy="125" r="7" fill="#0f0f1a" />
                    </svg>
                    <div class="motor-values">
                        <div class="motor-settings-container">
                            <button class="square-btn settings-btn" id="motorSettingsBtn" title="Motor settings">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="3"></circle>
                                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                                </svg>
                            </button>
                            <div class="motor-settings-menu" id="motorSettingsMenu">
                                <button class="menu-item" id="calibrateBtn">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <circle cx="12" cy="12" r="10"></circle>
                                        <line x1="22" y1="12" x2="18" y2="12"></line>
                                        <line x1="6" y1="12" x2="2" y2="12"></line>
                                        <line x1="12" y1="6" x2="12" y2="2"></line>
                                        <line x1="12" y1="22" x2="12" y2="18"></line>
                                    </svg>
                                    Calibrate
                                </button>
                                <button class="menu-item" id="zeroBtn">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <circle cx="12" cy="12" r="10"></circle>
                                        <line x1="12" y1="8" x2="12" y2="16"></line>
                                        <line x1="8" y1="12" x2="16" y2="12"></line>
                                    </svg>
                                    Zero
                                </button>
                            </div>
                        </div>
                        <div class="current-pos-value">
                            <span id="currentPosition">0°</span>
                        </div>
                        <div class="motor-value">
                            <span id="motorValue">0°</span>
                        </div>
                        <div class="moon-btn-container">
                            <span class="moon-angle-label" id="moonAngle">--°</span>
                            <button class="square-btn moon-btn" id="realMoonBtn" title="Set to Real Moon Position">🌙</button>
                        </div>
                    </div>
                </div>

                <!-- Auto Tracking Settings -->
                <div class="auto-tracking-section">
                    <div class="tracking-interval">
                        <input type="checkbox" id="autoTrackingToggle" class="tracking-checkbox" checked>
                        <label for="trackingInterval">Update every:</label>
                        <select id="trackingInterval">
                            <option value="5">5 minutes</option>
                            <option value="15">15 minutes</option>
                            <option value="30">30 minutes</option>
                            <option value="60" selected>1 hour</option>
                            <option value="120">2 hours</option>
                            <option value="360">6 hours</option>
                            <option value="720">12 hours</option>
                            <option value="1440">24 hours</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- Automations Tab -->
        <div class="tab-content" id="automations">
            <div class="card">
                <h2>Scheduled Lighting</h2>
                
                <div id="automationsList">
                    <p class="info-text">Connect to lamp to view automations.</p>
                </div>
                
                <!-- Add Schedule Button -->
                <button class="btn btn-primary" id="addAutomationBtn" style="width: 100%; margin-top: 16px;">Add Schedule</button>
            </div>
        </div>

    </div>

    <div class="tabs">
        <button class="tab-btn active" data-tab="presets">Presets</button>
        <button class="tab-btn" data-tab="motor">Motor</button>
        <button class="tab-btn" data-tab="automations">Schedule</button>
    </div>

    <script src="suncalc.js"></script>
    <script src="iro.min.js"></script>
    <script type="module" src="js/app.js"></script>
</body>

</html>
