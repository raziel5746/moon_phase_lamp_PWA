<!DOCTYPE html>
<html>
<head>
    <title>Reset PWA</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; padding: 20px; background: #1a1a2e; color: white; }
        button { padding: 20px 40px; font-size: 18px; margin: 10px; cursor: pointer; }
        #status { margin-top: 20px; padding: 10px; background: #333; border-radius: 8px; }
    </style>
</head>
<body>
    <h1>PWA Reset Tool</h1>
    <p>Click the button below to clear all service workers and caches.</p>
    <button onclick="resetAll()">Reset Everything</button>
    <div id="status"></div>
    
    <script>
        async function resetAll() {
            const status = document.getElementById('status');
            status.innerHTML = 'Clearing...';
            
            try {
                // Unregister all service workers
                const registrations = await navigator.serviceWorker.getRegistrations();
                for (const reg of registrations) {
                    await reg.unregister();
                    status.innerHTML += '<br>Unregistered SW: ' + reg.scope;
                }
                
                // Clear all caches
                const cacheNames = await caches.keys();
                for (const name of cacheNames) {
                    await caches.delete(name);
                    status.innerHTML += '<br>Deleted cache: ' + name;
                }
                
                status.innerHTML += '<br><br><strong>Done! Now go to the main app:</strong>';
                status.innerHTML += '<br><a href="index.html" style="color: #6366f1;">Open Moon Lamp</a>';
            } catch (e) {
                status.innerHTML += '<br>Error: ' + e.message;
            }
        }
    </script>
</body>
</html>
