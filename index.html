<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f0f1a">
    <meta name="description" content="Control your Moon Phase Lamp">

    <!-- iOS PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Moon Lamp">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icon-192.png">

    <title>Moon Lamp Control</title>
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- Modular CSS -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/tabs.css">
    <link rel="stylesheet" href="css/led-ring.css">
    <link rel="stylesheet" href="css/presets.css">
    <link rel="stylesheet" href="css/motor.css">
    <link rel="stylesheet" href="css/automations.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="stylesheet" href="css/responsive.css">

    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="icon" type="image/png" href="icon-192.png">
</head>

<body>
    <div class="container">
        <header>
            <div class="header-row">
                <div class="app-title">
                    <h1>Moon Lamp</h1>
                    <span id="titleMoonIcon"></span>
                </div>
                <div class="header-actions">
                    <!-- Reset button (hidden, for debugging)
                    <button class="reset-btn" id="resetAppBtn" title="Reset app and clear cache">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
                            <path d="M21 3v5h-5"/>
                            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
                            <path d="M3 21v-5h5"/>
                        </svg>
                    </button>
                    -->
                    <div class="connection-status" id="connectionStatus">
                        <span class="status-dot" id="statusDot"></span>
                    </div>
                </div>
            </div>
            <div class="header-row">
                <span id="deviceNameLabel" class="device-name"></span>
                <span id="appVersion" class="app-version"></span>
            </div>
        </header>

        <!-- Presets Tab -->
        <div class="tab-content active" id="presets">
            <div class="presets-layout">
                <div class="card color-presets-card">
                    <h2>Color Presets</h2>
                    <div class="preset-grid-scroll">
                        <div class="preset-grid">
                            <button class="preset-btn" data-preset="0">
                                <div class="preset-color" style="background: rgb(255,220,150);"></div>
                                <span>Warm White</span>
                            </button>
                            <button class="preset-btn" data-preset="1">
                                <div class="preset-color" style="background: rgb(255,100,0);"></div>
                                <span>Sunset</span>
                            </button>
                            <button class="preset-btn" data-preset="2">
                                <div class="preset-color" style="background: rgb(0,100,255);"></div>
                                <span>Ocean Blue</span>
                            </button>
                            <button class="preset-btn" data-preset="3">
                                <div class="preset-color" style="background: rgb(255,0,100);"></div>
                                <span>Pink Dream</span>
                            </button>
                            <button class="preset-btn" data-preset="4">
                                <div class="preset-color" style="background: rgb(100,255,100);"></div>
                                <span>Forest Green</span>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="card brightness-card">
                    <h2>Brightness</h2>
                    <div class="brightness-grid">
                        <button class="brightness-btn" data-brightness="0">0%</button>
                        <button class="brightness-btn" data-brightness="25">25%</button>
                        <button class="brightness-btn" data-brightness="50">50%</button>
                        <button class="brightness-btn" data-brightness="75">75%</button>
                        <button class="brightness-btn" data-brightness="100">100%</button>
                    </div>
                    <div class="brightness-slider-container">
                        <div class="brightness-slider" id="brightnessSlider">
                            <div class="brightness-slider-fill" id="brightnessSliderFill"></div>
                            <span class="brightness-slider-value" id="brightnessSliderValue">50%</span>
                        </div>
                    </div>
                </div>

                <div class="card settings-card">
                    <div class="settings-row">
                        <span class="mode-label">Lamp Mode</span>
                        <label class="toggle-switch">
                            <input type="checkbox" id="fullModeToggle" checked>
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <!-- Custom Tab -->
        <div class="tab-content" id="custom">
            <!-- LED Ring Visualization (only visible on Custom tab) -->
            <div class="card">
                <div class="led-ring-header">
                    <h2>LED Ring</h2>
                    <label class="toggle-label">
                        <input type="checkbox" id="selectMultipleToggle">
                        <span>Select multiple</span>
                    </label>
                </div>
                <div class="led-ring" id="ledRing">
                    <!-- LEDs will be generated by JavaScript -->
                    <button class="led-center-btn" id="selectAllBtn">
                        <span>ALL</span>
                    </button>
                </div>
            </div>

            <!-- Unified LED Control -->
            <div class="card">
                <h2>LED Control</h2>
                <p class="info-text" id="ledControlInfo">Select LEDs in the ring above, then apply color and brightness.
                </p>

                <div class="color-picker">
                    <label>Color:</label>
                    <input type="color" id="colorPicker" value="#ffdc96">
                </div>
                <div class="brightness-control">
                    <label>Brightness:</label>
                    <input type="range" id="customBrightness" min="0" max="100" value="75">
                    <span id="customBrightnessValue">75%</span>
                </div>

                <p class="info-text" id="selectedLedInfo">Selected: <span id="selectedLedCount">0 LEDs</span></p>

                <button class="btn btn-primary" id="applyCustomBtn">Select LEDs first</button>
            </div>
        </div>

        <!-- Motor Tab -->
        <div class="tab-content" id="motor">
            <div class="motor-layout">
                <div class="card motor-card">
                    <div class="motor-header">
                        <h2>Motor Control</h2>
                        <div class="motor-header-angles-anchor">
                            <div class="motor-angle-display">
                                <div class="current-pos-value"><span id="currentPosition">0°</span></div>
                                <div class="motor-value"><span id="motorValue">0°</span></div>
                            </div>
                        </div>
                    </div>
                    <div class="motor-dial-container">
                        <svg id="motorDial" viewBox="0 0 250 250">
                            <!-- Outer circle -->
                            <circle cx="125" cy="125" r="100" fill="none" stroke="rgba(200,207,232,0.2)" stroke-width="3" />
                            <circle cx="125" cy="125" r="85" fill="none" stroke="rgba(128,128,128,0.25)" stroke-width="1"
                                stroke-dasharray="4 4" />
                            <!-- Degree markers -->
                            <g id="degreeMarkers"></g>
                            <!-- Current position marker (blue) -->
                            <line id="currentPosMarker" x1="125" y1="125" x2="125" y2="35" stroke="#3b82f6" stroke-width="4"
                                stroke-linecap="round" opacity="0.7" />
                            <!-- Target pointer (green) -->
                            <line id="motorPointer" x1="125" y1="125" x2="125" y2="35" stroke="#22c55e" stroke-width="5"
                                stroke-linecap="round" />
                            <circle cx="125" cy="125" r="16" fill="#22c55e" />
                            <circle cx="125" cy="125" r="12" style="fill: var(--background)" />
                            <g id="dialMoonPhase"></g>
                        </svg>
                        
                        <div id="specificDateDisplay" class="specific-date-display">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                                <line x1="16" y1="2" x2="16" y2="6"></line>
                                <line x1="8" y1="2" x2="8" y2="6"></line>
                                <line x1="3" y1="10" x2="21" y2="10"></line>
                            </svg>
                            <span id="specificDateText"></span>
                        </div>
                    </div>
                    <div class="motor-buttons-container">
                        <div class="motor-left-buttons">
                            <div class="motor-settings-container">
                                <button class="square-btn settings-btn" id="motorSettingsBtn" title="Motor settings">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <circle cx="12" cy="12" r="3"></circle>
                                        <path
                                            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                                        </path>
                                    </svg>
                                </button>
                                <div class="motor-settings-menu" id="motorSettingsMenu">
                                    <button class="menu-item" id="updateEveryBtn">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <circle cx="12" cy="12" r="10"></circle>
                                            <polyline points="12 6 12 12 16 14"></polyline>
                                        </svg>
                                        Update every
                                    </button>
                                    <button class="menu-item" id="zeroBtn">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <circle cx="12" cy="12" r="10"></circle>
                                            <circle cx="12" cy="12" r="3"></circle>
                                        </svg>
                                        Set as New Moon
                                    </button>
                                    <button class="menu-item" id="fullMoonBtn">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <circle cx="12" cy="12" r="10" fill="currentColor"></circle>
                                        </svg>
                                        Set as Full Moon
                                    </button>
                                    <button class="menu-item" id="resetPositionBtn">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                                            <path d="M3 3v5h5"></path>
                                        </svg>
                                        Reset Position
                                    </button>
                                    <button class="menu-item" id="specificDateBtn">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                                            <line x1="16" y1="2" x2="16" y2="6"></line>
                                            <line x1="8" y1="2" x2="8" y2="6"></line>
                                            <line x1="3" y1="10" x2="21" y2="10"></line>
                                        </svg>
                                        Specific date
                                    </button>
                                </div>
                            </div>
                            <button class="square-btn speed-toggle-btn" id="speedToggleBtn" title="Motor speed">
                                <span id="speedToggleIcon">▶</span>
                            </button>
                        </div>
                        <div class="moon-btn-container">
                            <span class="moon-angle-label" id="moonAngle">--°</span>
                            <span class="auto-tracking-label" id="autoTrackingLabel"></span>
                            <button class="square-btn moon-btn" id="realMoonBtn"
                                title="Set to Real Moon Position">
                                <!-- Injected at runtime by motor-controller.js via moonIconSvg() from utils.js -->
                            </button>
                        </div>
                    </div>
                </div>

            </div>
            <div class="motor-presets-card">
                <div class="motor-preset-scroll">
                    <div class="motor-preset-list" id="motorPresetList"></div>
                </div>
            </div>
        </div>

        <!-- Automations Tab -->
        <div class="tab-content" id="automations">
            <div class="card">
                <h2>Scheduled Lighting</h2>

                <div id="automationsList">
                    <p class="info-text">Connect to lamp to view automations.</p>
                </div>

                <!-- Add Schedule Button -->
                <button class="btn btn-primary" id="addAutomationBtn">Add Schedule</button>
            </div>
        </div>

    </div>

    <div class="tabs">
        <button class="tab-btn active" data-tab="presets">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
            <span>Presets</span>
        </button>
        <button class="tab-btn" data-tab="motor">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="9"/><line x1="12" y1="3" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="21"/></svg>
            <span>Motor</span>
        </button>
        <button class="tab-btn" data-tab="automations">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <span>Schedule</span>
        </button>
    </div>

    <script src="suncalc.js"></script>
    <script src="iro.min.js"></script>
    <script type="module" src="js/app.js"></script>
</body>

</html>
